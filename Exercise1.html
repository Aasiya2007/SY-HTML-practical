<!DOCTYPE html>
<html>
    <head>
        <title>My Page</title>
        <style>
    
            body {
                background-color: #f2f2f2;
                font-family: Arial, sans-serif;
                text-align: center;
                padding-top: 100px;
            }

            h2 {
                color: #333333;
                font-size: 30px;
            }

            .btn {
                background-color: #007BFF;
                color: white;
                padding: 10px 20px;
                font-size: 16px;
                border: none;
                border-radius: 5px;
                cursor: pointer;
                text-decoration: none;
                display: inline-block;
                margin-top: 20px;
            }

            .btn:hover {
                background-color: #0056b3;
            }
        </style>
    </head>
    <body>

        <h2>Welcome</h2>
        <a href="#" class="btn">Click Here</a>

    </body>
</html>
