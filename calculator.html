<!DOCTYPE html>
<html>
<head>
    <title> Calculator</title>
</head>
<body>
    <h2>Simple Calculator</h2>    

<input type="number" id="num1" placeholder="Enter first number">
<br><br>

<input type="number" id="num2" placeholder="Enter second number">
<br><br>

<button onclick="Add()">Addition</button>
<button onclick="Subtract()">Subtract</button>
<button onclick="Multiply()">Multiply</button>
<button onclick="Divide()">Divide</button>

<h3 id="result"></h3>

<script>

function Add()
{
    let a = Number(document.getElementById("num1").value);
    let b = Number(document.getElementById("num2").value);
    document.getElementById("result").innerHTML = "Sum: " + (a + b);
}

function Subtract()
{
    let a = Number(document.getElementById("num1").value);
    let b = Number(document.getElementById("num2").value);
    document.getElementById("result").innerHTML = "Difference: " + (a - b);
}

function Multiply()
{
    let a = Number(document.getElementById("num1").value);
    let b = Number(document.getElementById("num2").value);
    document.getElementById("result").innerHTML = "Product: " + (a * b);
}

function Divide()
{
    let a = Number(document.getElementById("num1").value);
    let b = Number(document.getElementById("num2").value);
     document.getElementById("result").innerHTML = "Quotient: " + (a / b);
    
}

</script>

</body>
</html>
