<!DOCTYPE html>
<html>
<head>
    <title> Calculator</title>

<style>
    body {
        font-family: Arial, sans-serif;
        text-align: center;
        background-color:#0056b3;
    }

    input {
        padding: 10px;
        margin: 5px;
        border: 1px solid #ccc;
        border-radius: 5px;
    }

    button {
        padding: 10px 20px;
        margin: 5px;
        background-color: #007BFF;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }

    button:hover {
        background-color: #0056b3;
    }

    h3 {
        color: #333;
    }
</style>


</head>
<body>
   
    <h2>Simple Calculator</h2>

<input type="number" id="num1" placeholder="Enter first number">
<br><br>

<input type="number" id="num2" placeholder="Enter second number">
<br><br>

<button onclick="Add()">Addition</button>
<button onclick="Subtract()">Subtract</button>
<button onclick="Multiply()">Multiply</button>
<button onclick="Divide()">Divide</button>

<h3 id="result"></h3>

<script>

function Add()
{
    let a = Number(document.getElementById("num1").value);
    let b = Number(document.getElementById("num2").value);
    document.getElementById("result").innerHTML = "Sum: " + (a + b);
}

function Subtract()
{
    let a = Number(document.getElementById("num1").value);
    let b = Number(document.getElementById("num2").value);
    document.getElementById("result").innerHTML = "Difference: " + (a - b);
}

function Multiply()
{
    let a = Number(document.getElementById("num1").value);
    let b = Number(document.getElementById("num2").value);
    document.getElementById("result").innerHTML = "Product: " + (a * b);
}

function Divide()
{
    let a = Number(document.getElementById("num1").value);
    let b = Number(document.getElementById("num2").value);
     document.getElementById("result").innerHTML = "Quotient: " + (a / b);
      
}

</script>

</body>
</html>
